name: Fix Home Anchor
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_home_anchor.py'
      - '.github/workflows/fix-home-anchor.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch home anchor
        run: python .github/scripts/fix_home_anchor.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Home navigation anchor"
          git push origin main
