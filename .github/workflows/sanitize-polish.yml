name: Final sanitization polish

on:
  push:
    paths:
      - '.github/workflows/sanitize-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove residual employer-specific wording
        run: |
          python - <<'PY'
          from pathlib import Path
          changes = {
            'doc-verify.html': [
              ('<div class="case-detect detect-b"><span>NOTARY</span><b>Validated ✓</b></div>','<div class="case-detect detect-b"><span>EXECUTION</span><b>Validated ✓</b></div>'),
              ('This case study intentionally stays at a portfolio-safe level and omits confidential implementation details, client information and proprietary artifacts.','This case study focuses on product decisions and generalized examples; proprietary company, client and implementation details are intentionally omitted.')
            ],
            'title-automation.html': [
              ('<h3>Different LOB Rules</h3>','<h3>Workflow Variation</h3>'),
              ('provider failures','source failures'),
              ('One orchestration layer.<br><em>Many providers, rules and outputs.</em>','One orchestration layer.<br><em>Many sources, rules and outputs.</em>'),
              ('Shared platform vs. eight bespoke automations','Shared platform vs. bespoke automations'),
              ('which rules/providers drive operational load','which rules or sources drive operational load')
            ]
          }
          for file,pairs in changes.items():
            p=Path(file); s=p.read_text()
            for old,new in pairs:
              if old not in s:
                raise SystemExit(f'Missing expected text in {file}: {old}')
              s=s.replace(old,new)
            p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add doc-verify.html title-automation.html
          git commit -m 'Polish public-safe case study wording'
          git push
