name: Run ProductFlix personalization v1

on:
  push:
    paths:
      - '.github/workflows/personalization-v1-run.yml'

permissions:
  contents: write

jobs:
  personalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply personalization
        run: node .github/scripts/personalize-v1.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js styles.css
          git commit -m "Build intent-based portfolio personalization v1" || exit 0
          git push
