name: Expand ProductFlix source

on:
  push:
    paths:
      - 'productflix-v1-final.zip'
      - 'archive/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Expand ProductFlix source'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand uploaded ProductFlix package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .unpack
          mkdir -p .unpack
          if [ -f productflix-v1-final.zip ]; then
            unzip -q productflix-v1-final.zip -d .unpack
            if [ -d .unpack/productflix-v1 ]; then
              cp -a .unpack/productflix-v1/. .
            else
              cp -a .unpack/. .
            fi
            rm -f productflix-v1-final.zip
          elif [ -f archive/READY ]; then
            cat archive/part-* | base64 -d > productflix-source.tar.gz
            tar -xzf productflix-source.tar.gz -C .unpack
            cp -a .unpack/. .
            rm -rf archive productflix-source.tar.gz
          else
            echo 'No ProductFlix source package found.' >&2
            exit 1
          fi
          rm -rf .unpack

      - name: Commit expanded site
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Expand ProductFlix source'
          git push
