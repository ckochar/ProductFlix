name: Mode-specific hero visuals

on:
  push:
    paths:
      - '.github/workflows/mode-hero-visuals.yml'

permissions:
  contents: write

jobs:
  build-hero-visuals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build distinct hero art for each portfolio mode
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          html = p.read_text()
          start = html.index('      <div class="hero-art title-hero-art"')
          end_marker = '    </section>\n\n    <section class="mode-bar"'
          end = html.index(end_marker, start)

          hero_art = '''      <div class="hero-art mode-visual-stage" id="modeVisual" aria-label="Visual representing the selected Productflix mode">
        <div class="mode-visual mode-visual-hiring" aria-hidden="true">
          <div class="hiring-portrait"><img src="assets/photos/navy-blazer.jpg" alt=""></div>
          <div class="hiring-glow"></div>
          <div class="hiring-card hiring-card-a"><small>FINANCIAL PLATFORMS</small><strong>$180M+</strong><span>transaction scale</span></div>
          <div class="hiring-card hiring-card-b"><small>AI PRODUCTS</small><strong>Rules × AI × Human</strong><span>trust built into workflow</span></div>
          <div class="hiring-card hiring-card-c"><small>CAREER ARC</small><strong>Systems → AI</strong><span>8.5+ years</span></div>
          <div class="hiring-role-chip">SENIOR PRODUCT MANAGER</div>
        </div>

        <div class="mode-visual mode-visual-ai" aria-hidden="true">
          <div class="ai-orbit"></div>
          <div class="ai-node ai-node-rules"><small>01</small><strong>RULES</strong><span>certainty</span></div>
          <div class="ai-node ai-node-model"><small>02</small><strong>AI</strong><span>interpretation</span></div>
          <div class="ai-node ai-node-human"><small>03</small><strong>HUMAN</strong><span>judgment</span></div>
          <div class="ai-connector ai-connector-a"></div><div class="ai-connector ai-connector-b"></div>
          <div class="ai-evidence-card"><span>EVIDENCE LAYER</span><div><i>✓</i> source traceability</div><div><i>✓</i> confidence & exceptions</div><div><i>✓</i> reviewable decisions</div></div>
          <div class="ai-signal">AUTOMATE CERTAINTY · ESCALATE RISK</div>
        </div>

        <div class="mode-visual mode-visual-building" aria-hidden="true">
          <div class="build-browser">
            <div class="build-browser-top"><i></i><i></i><i></i><span>prototype://product-thinking</span></div>
            <div class="build-canvas">
              <div class="build-module module-assay"><small>01 · SHIPPED</small><strong>ASSAY</strong><span>AI document QC</span></div>
              <div class="build-module module-copilot"><small>02 · PROTOTYPE</small><strong>AI COPILOT</strong><span>challenge the assumption</span></div>
              <div class="build-module module-sim"><small>03 · INTERACTIVE</small><strong>DECISION SIM</strong><span>make the product call</span></div>
              <div class="build-wire wire-a"></div><div class="build-wire wire-b"></div>
            </div>
          </div>
          <div class="build-stamp">CONCEPT → PROTOTYPE → TEST → LEARN</div>
        </div>

        <div class="mode-visual mode-visual-life" aria-hidden="true">
          <figure class="life-hero-photo life-photo-main"><img src="assets/photos/boats-sunset-leaves.jpg" alt=""></figure>
          <figure class="life-hero-photo life-photo-travel"><img src="assets/photos/sunset-silhouette.jpg" alt=""></figure>
          <figure class="life-hero-photo life-photo-portrait"><img src="assets/photos/blue-wall-portrait.jpg" alt=""></figure>
          <div class="life-film-mark"><span>TRAVEL</span><i></i><span>PHOTOGRAPHY</span><i></i><span>SPORT</span><i></i><span>FOOD</span></div>
        </div>

        <div class="mode-visual mode-visual-explore" aria-hidden="true">
          <div class="explore-grid">
            <div class="explore-tile explore-work"><span>WORK</span><strong>Products</strong></div>
            <div class="explore-tile explore-think"><span>THINK</span><strong>Decisions</strong></div>
            <div class="explore-tile explore-build"><span>BUILD</span><strong>Experiments</strong></div>
            <div class="explore-tile explore-life" style="--explore-image:url('assets/photos/boats-sunset-leaves.jpg')"><span>LIFE</span><strong>Stories</strong></div>
          </div>
          <div class="explore-center">PRODUCT<span>FLIX</span></div>
        </div>
      </div>
'''
          html = html[:start] + hero_art + html[end:]
          p.write_text(html)

          css = Path('styles.css')
          s = css.read_text()
          marker = '/* MODE HERO VISUALS V2 */'
          if marker in s:
            s = s[:s.index(marker)].rstrip() + '\n'
          s += r'''

/* MODE HERO VISUALS V2 */
.mode-visual-stage{position:relative;min-height:430px;align-self:center;transform:none;isolation:isolate}
.mode-visual-stage::before{content:"";position:absolute;inset:-60px -100px;background:radial-gradient(circle at 56% 45%,rgba(242,198,109,.13),transparent 40%);filter:blur(14px);z-index:-3}
.mode-visual{position:absolute;inset:0;display:none;animation:modeVisualIn .38s cubic-bezier(.2,.8,.2,1) both}
.mode-visual-hiring{display:block}
body[data-mode] .mode-visual{display:none}
body[data-mode="hiring"] .mode-visual-hiring,body[data-mode="ai"] .mode-visual-ai,body[data-mode="building"] .mode-visual-building,body[data-mode="life"] .mode-visual-life,body[data-mode="explore"] .mode-visual-explore{display:block}
@keyframes modeVisualIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}

/* Hiring: Chirag + proof, not a project screenshot */
.mode-visual-hiring{perspective:1100px}
.hiring-glow{position:absolute;width:330px;height:330px;border-radius:50%;right:13%;top:9%;background:radial-gradient(circle,rgba(242,198,109,.26),rgba(66,105,142,.08) 48%,transparent 70%);filter:blur(12px)}
.hiring-portrait{position:absolute;right:12%;top:2%;width:46%;height:94%;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.12);box-shadow:0 32px 80px rgba(0,0,0,.48);transform:rotateY(-4deg)}
.hiring-portrait::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(7,9,12,.1) 60%,rgba(7,9,12,.82) 100%),linear-gradient(90deg,rgba(8,10,14,.35),transparent 45%)}
.hiring-portrait img{width:100%;height:100%;object-fit:cover;object-position:center 18%;filter:saturate(.88) contrast(1.04)}
.hiring-card{position:absolute;z-index:4;width:220px;padding:14px 15px;border-radius:10px;background:rgba(11,15,20,.86);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);box-shadow:0 18px 42px rgba(0,0,0,.33)}
.hiring-card small{display:block;color:var(--gold);font-size:9px;font-weight:800;letter-spacing:.09em;margin-bottom:6px}.hiring-card strong{display:block;font:700 18px/1.1 "Manrope",sans-serif}.hiring-card span{display:block;color:#adb4bd;font-size:10px;margin-top:4px}
.hiring-card-a{left:0;top:12%}.hiring-card-b{left:4%;top:43%;width:245px}.hiring-card-c{left:11%;bottom:5%;width:205px}
.hiring-role-chip{position:absolute;right:15%;bottom:7%;z-index:5;padding:8px 12px;border-radius:999px;background:rgba(242,198,109,.92);color:#17110a;font-size:9px;font-weight:900;letter-spacing:.08em;box-shadow:0 12px 28px rgba(0,0,0,.3)}

/* Product × AI: decision architecture */
.mode-visual-ai{background:radial-gradient(circle at 52% 43%,rgba(71,128,190,.18),transparent 34%)}
.ai-orbit{position:absolute;width:330px;height:330px;left:26%;top:9%;border:1px solid rgba(139,186,248,.18);border-radius:50%;box-shadow:0 0 80px rgba(65,128,191,.11),inset 0 0 70px rgba(65,128,191,.06)}
.ai-orbit::before,.ai-orbit::after{content:"";position:absolute;border:1px solid rgba(242,198,109,.13);border-radius:50%}.ai-orbit::before{inset:42px}.ai-orbit::after{inset:92px}
.ai-node{position:absolute;z-index:3;width:135px;height:135px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(12,17,23,.93);border:1px solid rgba(255,255,255,.16);box-shadow:0 18px 45px rgba(0,0,0,.38)}
.ai-node small{color:#8f99a6;font-size:9px}.ai-node strong{font:800 17px/1 "Manrope",sans-serif;margin:5px 0}.ai-node span{color:#aeb6c0;font-size:10px}
.ai-node-rules{left:4%;top:31%;border-color:rgba(242,198,109,.42)}.ai-node-model{left:38%;top:8%;width:155px;height:155px;border-color:rgba(139,186,248,.5);box-shadow:0 0 50px rgba(71,128,190,.22),0 18px 45px rgba(0,0,0,.38)}.ai-node-human{right:3%;top:34%;border-color:rgba(98,216,155,.35)}
.ai-connector{position:absolute;height:1px;background:linear-gradient(90deg,rgba(242,198,109,.35),rgba(139,186,248,.65),rgba(98,216,155,.35));top:48%;z-index:1}.ai-connector-a{left:26%;width:18%;transform:rotate(-18deg)}.ai-connector-b{left:58%;width:20%;transform:rotate(18deg)}
.ai-evidence-card{position:absolute;left:28%;bottom:4%;width:48%;padding:13px 16px;border-radius:9px;background:rgba(8,12,17,.9);border:1px solid rgba(139,186,248,.18);display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:9px;align-items:center;box-shadow:0 18px 45px rgba(0,0,0,.28)}
.ai-evidence-card>span{font-size:9px;color:var(--blue);font-weight:800;letter-spacing:.08em}.ai-evidence-card div{font-size:9px;color:#b8c0c9}.ai-evidence-card i{font-style:normal;color:var(--green);margin-right:4px}.ai-signal{position:absolute;right:2%;top:7%;font-size:9px;color:#8793a0;letter-spacing:.08em;writing-mode:vertical-rl}

/* Building: prototypes in motion */
.mode-visual-building{perspective:1000px}
.build-browser{position:absolute;left:6%;right:3%;top:7%;bottom:9%;border-radius:15px;background:#0c1117;border:1px solid rgba(255,255,255,.14);box-shadow:0 32px 78px rgba(0,0,0,.46);overflow:hidden;transform:rotateY(-5deg) rotateX(1deg)}
.build-browser-top{height:38px;border-bottom:1px solid rgba(255,255,255,.09);display:flex;align-items:center;gap:6px;padding:0 12px;color:#727b86;font-size:9px}.build-browser-top i{width:7px;height:7px;border-radius:50%;background:#353d46}.build-browser-top span{margin-left:8px;padding:5px 10px;border-radius:5px;background:#111820;border:1px solid rgba(255,255,255,.06)}
.build-canvas{position:absolute;inset:39px 0 0;background:radial-gradient(circle at 50% 50%,rgba(93,145,197,.08),transparent 36%),linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:auto,24px 24px,24px 24px}
.build-module{position:absolute;width:180px;padding:14px;border-radius:10px;background:#121a22;border:1px solid rgba(255,255,255,.11);box-shadow:0 15px 35px rgba(0,0,0,.28);z-index:3}.build-module small{display:block;color:#7f8995;font-size:8px;letter-spacing:.08em}.build-module strong{display:block;font:800 16px/1.1 "Manrope",sans-serif;margin:7px 0 4px}.build-module span{font-size:9px;color:#aeb6bf}.module-assay{left:7%;top:13%;border-color:rgba(98,216,155,.26)}.module-copilot{right:7%;top:20%;border-color:rgba(139,186,248,.28)}.module-sim{left:34%;bottom:9%;border-color:rgba(242,198,109,.32)}
.build-wire{position:absolute;height:1px;background:rgba(242,198,109,.35);z-index:1}.wire-a{width:31%;left:31%;top:38%;transform:rotate(8deg)}.wire-b{width:26%;left:31%;top:61%;transform:rotate(25deg)}
.build-stamp{position:absolute;right:1%;bottom:1%;padding:8px 12px;border:1px solid rgba(242,198,109,.22);background:rgba(12,15,19,.85);border-radius:999px;color:#d9bd81;font-size:9px;font-weight:800;letter-spacing:.06em}

/* Life: actual personal media */
.mode-visual-life{filter:saturate(.92)}
.life-hero-photo{position:absolute;margin:0;overflow:hidden;border-radius:14px;border:1px solid rgba(255,255,255,.16);box-shadow:0 28px 65px rgba(0,0,0,.45);background:#111}
.life-hero-photo img{width:100%;height:100%;object-fit:cover;display:block}.life-photo-main{right:11%;top:4%;width:55%;height:83%;transform:rotate(1.5deg)}.life-photo-main img{object-position:center}.life-photo-travel{left:3%;top:18%;width:31%;height:51%;transform:rotate(-5deg)}.life-photo-portrait{right:0;bottom:1%;width:28%;height:47%;transform:rotate(5deg)}
.life-film-mark{position:absolute;left:18%;bottom:2%;z-index:5;padding:8px 13px;border-radius:999px;background:rgba(8,10,13,.8);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);display:flex;align-items:center;gap:7px;color:#e8e5dd;font-size:8px;font-weight:800;letter-spacing:.07em}.life-film-mark i{width:3px;height:3px;border-radius:50%;background:var(--gold)}
body[data-mode="life"] .mode-visual-stage::before{background:radial-gradient(circle at 65% 45%,rgba(232,153,68,.18),transparent 42%),radial-gradient(circle at 35% 38%,rgba(64,125,175,.17),transparent 34%)}

/* Just Explore: the catalog itself */
.explore-grid{position:absolute;inset:8% 5% 8% 8%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;transform:rotateY(-4deg)}
.explore-tile{position:relative;border-radius:12px;border:1px solid rgba(255,255,255,.11);overflow:hidden;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;background:#111820;box-shadow:0 15px 38px rgba(0,0,0,.24)}.explore-tile::before{content:"";position:absolute;inset:0;z-index:-1}.explore-tile span{font-size:8px;color:var(--gold);font-weight:900;letter-spacing:.11em}.explore-tile strong{font:700 17px/1.1 "Manrope",sans-serif;margin-top:3px}.explore-work::before{background:radial-gradient(circle at 75% 25%,rgba(242,198,109,.25),transparent 28%)}.explore-think::before{background:radial-gradient(circle at 70% 30%,rgba(139,186,248,.25),transparent 30%)}.explore-build::before{background:linear-gradient(140deg,transparent 35%,rgba(98,216,155,.13))}.explore-life::before{background:linear-gradient(180deg,rgba(5,7,9,.05),rgba(5,7,9,.82)),var(--explore-image) center/cover}
.explore-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;padding:12px 16px;background:#090c10;border:1px solid rgba(255,255,255,.16);border-radius:8px;box-shadow:0 18px 44px rgba(0,0,0,.46);font:800 16px/1 "Manrope",sans-serif}.explore-center span{color:var(--gold)}

@media(max-width:900px){
  .mode-visual-stage{min-height:330px;margin-top:8px}
  .hiring-portrait{right:7%;width:55%}.hiring-card{width:170px;padding:10px}.hiring-card-b{width:185px}.hiring-card strong{font-size:14px}.hiring-card-c{left:4%}
  .ai-node{width:105px;height:105px}.ai-node-model{width:120px;height:120px;left:36%}.ai-evidence-card{left:17%;width:70%;grid-template-columns:1fr;gap:4px}.ai-signal{display:none}
  .build-module{width:145px;padding:10px}.module-sim{left:29%}
  .life-photo-main{right:6%;width:61%}.life-photo-travel{left:1%;width:35%}.life-photo-portrait{width:31%}.life-film-mark{left:7%;font-size:7px}
}
@media(max-width:620px){
  .mode-visual-stage{min-height:285px}
  .hiring-portrait{right:2%;width:58%;height:90%;top:5%}.hiring-card{width:145px}.hiring-card-a{left:0;top:8%}.hiring-card-b{left:0;top:39%;width:155px}.hiring-card-c{left:2%;bottom:2%;width:145px}.hiring-card span{display:none}.hiring-role-chip{right:5%;font-size:7px}
  .ai-node{width:86px;height:86px}.ai-node strong{font-size:12px}.ai-node span{font-size:8px}.ai-node-model{width:100px;height:100px;left:35%;top:8%}.ai-node-rules{left:1%;top:35%}.ai-node-human{right:0;top:37%}.ai-evidence-card{left:12%;bottom:0;width:78%;padding:9px}.ai-evidence-card div{display:none}
  .build-browser{left:1%;right:1%}.build-module{width:125px}.module-assay{left:3%}.module-copilot{right:3%}.module-sim{left:28%}.build-stamp{font-size:7px}
  .life-photo-main{right:3%;width:62%;height:78%}.life-photo-travel{width:38%;height:48%}.life-photo-portrait{right:0;width:34%;height:43%}.life-film-mark{left:2%;gap:4px;padding:6px 8px}.life-film-mark span:nth-of-type(n+3){display:none}
}
'''
          css.write_text(s)
          PY

          git add index.html styles.css
          git commit -m "Add purpose-built hero visuals for each mode"
          git push
