name: Credibility and recruiter polish

on:
  push:
    paths:
      - '.github/workflows/credibility-polish-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply credibility polish
        run: python .github/scripts/credibility-polish-v3.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js product-journey.html publicis-reservation.html resume.html productflix-case-study.html
          git commit -m "Polish recruiter credibility and payments proof" || exit 0
          git push
