name: Fix ProductFlix default mode

on:
  push:
    paths:
      - '.github/workflows/fix-default-mode.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make bare URL always default to Hiring
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app.js')
          s = p.read_text()

          old = '''const params=new URLSearchParams(window.location.search);const requestedMode=params.get("mode");let initialMode=modeConfig[requestedMode]?requestedMode:"hiring";if(!requestedMode){try{const saved=localStorage.getItem("productflix-mode");if(saved&&modeConfig[saved])initialMode=saved}catch(_){}}applyMode(initialMode,{updateUrl:false,animate:false});'''
          new = '''const params=new URLSearchParams(window.location.search);\nconst requestedMode=params.get("mode");\n// URL intent always wins. A bare homepage always starts in the Hiring cut,\n// regardless of what this browser selected on a previous visit.\nconst initialMode=modeConfig[requestedMode]?requestedMode:"hiring";\napplyMode(initialMode,{updateUrl:false,animate:false});'''

          if old not in s:
              raise SystemExit('Expected initial-mode block not found in app.js')

          s = s.replace(old, new, 1)

          # Keep localStorage writes harmless for now, but they no longer influence initial load.
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Default bare ProductFlix URL to Hiring mode" || exit 0
          git push
