name: Run final Featured Work polish

on:
  push:
    paths:
      - '.github/workflows/run-final-featured-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply polish
        run: python .github/scripts/final_featured_polish.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git commit -m "Tighten Featured Work final polish" || exit 0
          git push
