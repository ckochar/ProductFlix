name: Sync latest resume metrics
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/sync_latest_resume_metrics.py'
      - '.github/workflows/sync-latest-resume-metrics.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync latest resume metrics
        run: python .github/scripts/sync_latest_resume_metrics.py
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '*.js' '*.md' 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sync portfolio metrics to latest resume"
          git push origin main
