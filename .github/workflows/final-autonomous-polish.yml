name: Final autonomous ProductFlix polish

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/final_autonomous_polish.py'
      - '.github/workflows/final-autonomous-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final ProductFlix polish
        run: python .github/scripts/final_autonomous_polish.py
      - name: Commit polished site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Finish ProductFlix recruiter-ready polish"
          git push origin main
