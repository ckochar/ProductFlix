name: Sanitize public portfolio

on:
  push:
    paths:
      - '.github/workflows/sanitize-portfolio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sanitize:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Sanitize employer case studies'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sanitize employer-linked portfolio content
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new, required=True):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  if required:
                      raise SystemExit(f'Missing expected text in {path}: {old[:90]!r}')
                  return
              p.write_text(s.replace(old, new))

          def regex_replace(path, pattern, repl, count=1):
              p=Path(path); s=p.read_text()
              out,n=re.subn(pattern,repl,s,count=count,flags=re.S)
              if n != count:
                  raise SystemExit(f'Expected {count} regex replacements in {path}, got {n}: {pattern[:80]}')
              p.write_text(out)

          # HOME PAGE: remove modeled/confidential hero numbers and label realized/scale metrics.
          replace('index.html','<h1 id="hero-title"><span>TITLE</span> AUTOMATION</h1>','<h1 id="hero-title"><span>TITLE WORKFLOW</span> AUTOMATION</h1>')
          replace('index.html','An intelligent title-search and production platform that connects external sources, automates search and data keying, assembles the package, and routes only exceptions to people.','Turning fragmented search, document and data workflows into an exception-driven automation platform with configurable rules, external integrations, document intelligence and human review.')
          replace('index.html','<span>$1.5M projected annual savings</span><i></i><span>8 lines of business</span><i></i><span>Search + keying automation</span>','<span>0→1 platform</span><i></i><span>Workflow automation</span><i></i><span>AI extraction + human review</span>')
          replace('index.html','2026 <span>•</span> Enterprise Automation <span>•</span> 8 LOBs <span>•</span> In Build','2026 <span>•</span> Enterprise Automation <span>•</span> In Build')
          replace('index.html','<div class="confidence"><strong>$1.5M</strong><span>Projected annual savings</span></div>','<div class="confidence"><strong>IN BUILD</strong><span>Exception-driven workflow automation</span></div>')
          replace('index.html','<div><span class="section-kicker">Impact library</span><h2>Products That Moved the Metric</h2></div>','<div><span class="section-kicker">Evidence library</span><h2>Impact & Scale</h2></div>')
          replace('index.html','          <button class="metric-card" data-open="doc-verify"><span class="metric-icon">▤</span><div><strong>$184K <small>/ year</small></strong><span>AI document automation</span></div></button>\n','')
          replace('index.html','          <button class="metric-card" data-open="doc-verify"><span class="metric-icon">♟</span><div><strong>4.4 <small>FTE</small></strong><span>Capacity unlocked</span></div></button>\n','')
          replace('index.html','<div class="metric-row" id="metricRow">\n','<div class="metric-row" id="metricRow">\n          <button class="metric-card" data-open="accounting-payments"><span class="metric-icon">◎</span><div><strong>$180M+</strong><span>Annual transaction flow · SCALE</span></div></button>\n')
          replace('index.html','<button class="metric-card" data-open="accounting-payments"><span class="metric-icon">◫</span><div><strong>$480K</strong><span>Revenue leakage recovered</span></div></button>','<button class="metric-card" data-open="accounting-payments"><span class="metric-icon">◫</span><div><strong>$480K</strong><span>Revenue leakage addressed · REALIZED</span></div></button>')
          replace('index.html','<button class="metric-card" data-open="accounting-payments"><span class="metric-icon">↘</span><div><strong>−30%</strong><span>Reconciliation effort</span></div></button>','<button class="metric-card" data-open="accounting-payments"><span class="metric-icon">↘</span><div><strong>−30%</strong><span>Reconciliation effort · REALIZED</span></div></button>')
          replace('index.html','<button class="metric-card" data-open="accounting-payments"><span class="metric-icon">◷</span><div><strong>−23%</strong><span>Vendor payment cycle</span></div></button>','<button class="metric-card" data-open="accounting-payments"><span class="metric-icon">◷</span><div><strong>−23%</strong><span>Vendor payment cycle · REALIZED</span></div></button>')
          replace('index.html','Nine years of building across industries','8.5+ years across systems, transactions, platforms & AI')
          replace('index.html','<div class="poster-title"><span>DOC</span> VERIFY</div>','<div class="poster-title"><span>DOCUMENT</span> VERIFICATION</div>')
          replace('index.html','<div class="poster-caption"><strong>Doc Verify</strong><span>AI document intelligence</span></div>','<div class="poster-caption"><strong>Document Verification</strong><span>Rules, AI interpretation & human review</span></div>')
          replace('index.html','<div class="poster-caption"><strong>Title Automation</strong><span>From documents to structured data</span></div>','<div class="poster-caption"><strong>Title Workflow Automation</strong><span>From fragmented work to orchestrated flow</span></div>')

          # DOCUMENT VERIFICATION: abstract employer operations, exact business case, reject distributions and rollout plan.
          replace('doc-verify.html','DOC VERIFY','DOCUMENT VERIFICATION')
          replace('doc-verify.html','I led the 0→1 product strategy for an AI-assisted quality-control workflow combining deterministic rules, OCR/LLM interpretation and human review for high-volume mortgage document packages.','I led the product strategy for an AI-assisted verification workflow combining deterministic rules, document intelligence and human review to reduce repetitive manual QC in a regulated environment.')
          replace('doc-verify.html','<span>Domain <strong>Mortgage Operations</strong></span>','<span>Domain <strong>Regulated Operations</strong></span>')
          regex_replace('doc-verify.html',r'<div class="case-kpis" aria-label="Doc Verify headline impact">.*?</div>\s*</section>','''<div class="case-kpis" aria-label="Document Verification product principles">\n        <div><strong>RULES-FIRST</strong><span>automate deterministic checks</span></div>\n        <div><strong>AI-ASSISTED</strong><span>interpret variable evidence</span></div>\n        <div><strong>HUMAN-IN-LOOP</strong><span>escalate ambiguity and risk</span></div>\n        <div><strong>AUDITABLE</strong><span>preserve evidence and overrides</span></div>\n      </div>\n    </section>''')
          replace('doc-verify.html','<h2>High-volume QC was still a human search problem.</h2>\n          <p>Loan-modification document packages flowed through a manual quality-control step before downstream processing. Auditors repeatedly searched for the same types of execution failures — missing borrower signatures, notary issues and incorrect dates — package after package.</p>\n          <p>The workflow worked, but it consumed skilled capacity on highly repetitive checks and pushed exceptions into a rework cycle that could take days.</p>','<h2>High-volume document verification was still a human search problem.</h2>\n          <p>Reviewers repeatedly inspected document packages for execution, completeness and consistency issues. Many checks were predictable, but people still had to locate evidence manually before making a decision.</p>\n          <p>The product opportunity was not simply to “add AI.” It was to determine which decisions could be automated deterministically, which required interpretation, and which should remain human-owned.</p>')
          regex_replace('doc-verify.html',r'<div class="before-flow" aria-label="Previous manual review workflow">.*?</div>\s*</section>','''<div class="before-flow" aria-label="Previous manual review workflow">\n        <div><span>01</span><strong>Package arrives</strong><small>Documents enter review</small></div>\n        <b>→</b>\n        <div><span>02</span><strong>Reviewer searches</strong><small>Locate relevant evidence</small></div>\n        <b>→</b>\n        <div><span>03</span><strong>Human decision</strong><small>Pass / review / investigate</small></div>\n        <b>→</b>\n        <div><span>04</span><strong>Exception handling</strong><small>Resolve ambiguity with context</small></div>\n      </div>\n    </section>''')
          replace('doc-verify.html','<p>Working with operations, I decomposed the QC workflow into repeatable failure modes. Roughly 80% of the review surface was rule-oriented, and most deterministic rejects clustered around a small set of checks.</p>\n          <p>That changed the solution architecture. Instead of asking an LLM to judge everything, we could reserve AI for document interpretation and ambiguity while keeping deterministic validation explicit and auditable.</p>','<p>Working with operations, I decomposed the verification workflow into repeatable decision types. The key insight was that many conditions did not need AI at all.</p>\n          <p>That changed the solution architecture. Instead of asking a model to judge everything, deterministic validation could remain explicit and auditable while AI handled variable document interpretation and ambiguity.</p>')
          regex_replace('doc-verify.html',r'<div class="reject-chart" aria-label="Distribution of common deterministic rejection categories">.*?</div>\s*</section>','''<div class="decision-matrix">\n        <article><span class="decision-number">01</span><div class="decision-icon deterministic">✓</div><h3>Deterministic</h3><p>Rules own conditions that can be computed reliably.</p><small>Example · required evidence exists</small></article>\n        <article><span class="decision-number">02</span><div class="decision-icon ai">✦</div><h3>Interpretive</h3><p>AI helps locate or interpret evidence when documents vary.</p><small>Example · variable layout or language</small></article>\n        <article><span class="decision-number">03</span><div class="decision-icon human">◎</div><h3>Ambiguous / material</h3><p>People retain ownership when confidence is low or judgment matters.</p><small>Example · conflicting evidence</small></article>\n      </div>\n    </section>''')
          replace('doc-verify.html','<article><span>04</span><div><h3>Why phased rollout?</h3><p>The rollout sequence was designed to learn from lower-complexity flows before expanding into more variable execution channels.</p></div></article>','<article><span>04</span><div><h3>Why phased rollout?</h3><p>Start with more structured workflows, validate accuracy and exception behavior, then expand into higher-variation scenarios.</p></div></article>')
          regex_replace('doc-verify.html',r'<section class="case-section rollout-section" id="rollout">.*?</section>','''<section class="case-section rollout-section" id="rollout">\n      <div class="case-section-label">06 · ROLLOUT</div>\n      <div class="case-grid two-col">\n        <div class="case-copy-block">\n          <h2>Roll out by uncertainty, not by ambition.</h2>\n          <p>I favored a staged rollout that began with more structured workflows and progressively introduced higher-variation scenarios. Each phase was intended to validate accuracy, exception behavior and reviewer trust before expanding automation coverage.</p>\n        </div>\n        <div class="rollout-rail">\n          <div class="rollout-step active"><b>01</b><span>Structured flows</span><small>Validate accuracy and evidence</small></div>\n          <div class="rollout-step"><b>02</b><span>Broader variation</span><small>Expand document and exception diversity</small></div>\n          <div class="rollout-step"><b>03</b><span>Higher ambiguity</span><small>Scale only after trust is established</small></div>\n        </div>\n      </div>\n    </section>''')
          regex_replace('doc-verify.html',r'<section class="case-section impact-section" id="impact">.*?</section>','''<section class="case-section impact-section" id="impact">\n      <div class="case-section-label">07 · EXPECTED / MODELED OUTCOMES</div>\n      <h2 class="section-display">The value is shifting people away from repetitive verification.</h2>\n      <div class="impact-grid">\n        <article><strong>LESS</strong><span>repetitive review effort</span></article>\n        <article><strong>FASTER</strong><span>first-pass verification</span></article>\n        <article><strong>CONSISTENT</strong><span>repeatable decisions</span></article>\n        <article><strong>AUDITABLE</strong><span>evidence + human overrides</span></article>\n      </div>\n      <div class="impact-statement">\n        <span>FROM</span><strong>manual evidence hunting</strong><i>→</i><span>TO</span><strong>automated first pass + focused human review</strong>\n      </div>\n    </section>''')
          for old,new in [('MORTGAGE DOCUMENT','DOCUMENT PACKAGE'),('LOAN MODIFICATION AGREEMENT','EXECUTED AGREEMENT'),('Borrower signature','Required signature'),('BORROWER SIGNATURE','REQUIRED SIGNATURE'),('Notary commission','Execution evidence'),('NOTARY BLOCK','EXECUTION BLOCK'),('Doc Verify','Document Verification')]:
              replace('doc-verify.html',old,new,required=False)

          # TITLE WORKFLOW AUTOMATION: keep platform thinking while abstracting scale, providers and modeled dollar case.
          replace('title-automation.html','TITLE AUTOMATION','TITLE WORKFLOW AUTOMATION')
          replace('title-automation.html','Reimagining title search and production as an intelligent workflow — connecting external title sources, automating search and data keying, assembling the package, and routing only the exceptions to people.','I’m leading the product strategy for an automation platform that connects external data sources, document retrieval, structured extraction, workflow rules and human exception handling into one orchestrated experience.')
          replace('title-automation.html','<span>0→1 Platform</span><span>8 LOBs</span><span>Integrations</span><span>AI Extraction</span><span>Human Review</span>','<span>0→1 Platform</span><span>Workflow Automation</span><span>External Integrations</span><span>Document Intelligence</span><span>Human Review</span>')
          regex_replace('title-automation.html',r'<div class="impact-strip">.*?</div>\s*<p class="confidential-note">.*?</p>','''<div class="impact-strip"><div><strong>IN BUILD</strong><span>0→1 platform</span></div><div><strong>RULES</strong><span>configurable orchestration</span></div><div><strong>AI</strong><span>structured extraction</span></div><div><strong>HUMAN</strong><span>exception review</span></div></div>\n      <p class="confidential-note"><strong>Case-study note:</strong> This portfolio focuses on product decisions and uses generalized examples; proprietary company, client and implementation details are intentionally omitted.</p>''')
          replace('title-automation.html','<div class="automation-badge"><div><strong>$1.5M</strong><span>annual savings</span></div></div>','<div class="automation-badge"><div><strong>IN BUILD</strong><span>workflow automation</span></div></div>')
          replace('title-automation.html','Eight business lines shared a core problem but had different products, providers, rules and downstream needs.','Multiple business workflows shared a core problem but differed in rules, source requirements and downstream needs.')
          replace('title-automation.html','Shared platform capabilities with business-line-specific rules allow the same automation backbone to support multiple LOBs.','Shared platform capabilities with configurable rules allow the same automation backbone to support multiple workflow variants.')
          for old,new in [
              ('Title plant / provider integrations','Approved external data sources'),
              ('Title plants and data providers become part of the workflow rather than destinations users manually visit.','Approved external data sources become part of the workflow rather than destinations users manually visit.'),
              ('LOB + product + property context','Request + workflow context'),
              ('Rules select source / provider path','Rules resolve the appropriate source path'),
              ('Provider integration returns results','Approved source returns results'),
              ('provider timeout','source timeout'),
              ('Provider abstraction','Source abstraction'),
              ('providers can evolve','sources can evolve'),
              ('provider strategy','source strategy'),
              ('Provider intelligence','Source intelligence'),
              ('cost, geography, turnaround and source quality','quality, availability, turnaround and source reliability')]:
              replace('title-automation.html',old,new,required=False)
          replace('title-automation.html','<h3>Where the $1.5M comes from</h3>','<h3>Where the product creates leverage</h3>')
          replace('title-automation.html','Remove repetitive provider navigation, query entry, result collection and search handoffs.','Reduce repetitive navigation, retrieval work and search handoffs.')
          replace('title-automation.html','Extract, validate and map production data instead of re-entering information from reports and documents.','Extract, validate and structure information instead of repeatedly interpreting and re-entering it.')
          replace('title-automation.html','Reduce manual document collection, naming, ordering and assembly steps.','Reduce manual document collection and repetitive production steps.')
          regex_replace('title-automation.html',r'<section class="case-section reveal" id="impact">.*?</section>','''<section class="case-section reveal" id="impact">\n    <div class="section-label">05 · MODELED BUSINESS CASE</div>\n    <div class="impact-hero"><span>BUSINESS CASE</span><strong>OPERATING LEVERAGE</strong><p>The modeled opportunity comes from reducing repetitive search, data entry and package-production work. The initiative is still being implemented, so modeled opportunity is intentionally separated from realized outcomes.</p></div>\n    <div class="impact-grid">\n      <article><strong>Search</strong><span>manual navigation → integrated execution</span></article>\n      <article><strong>Extraction</strong><span>manual entry → structured data</span></article>\n      <article><strong>Assembly</strong><span>repetitive steps → orchestrated workflow</span></article>\n      <article><strong>Exceptions</strong><span>broad manual work → focused review</span></article>\n    </div>\n  </section>''')
          replace('title-automation.html','See how I approach<br>AI document verification.','See how I approach<br>AI-assisted document verification.')
          replace('title-automation.html','Watch Doc Verify →','Watch Document Verification →')

          # PRODUCT JOURNEY: keep employer history but decouple it from detailed internal initiatives.
          replace('product-journey.html','CMU and a founding-PM internship pushed the work upstream: customer discovery, ambiguous zero-to-one problems, product strategy and rapid experimentation.','CMU and a Founding PM role at LUPR pushed the work upstream: customer discovery, ambiguous zero-to-one problems, product strategy and rapid experimentation.')
          replace('product-journey.html','<div class="year">2025—NOW</div><div class="chapter"><span>05 · PLATFORMS</span><h2>Financial Infrastructure</h2><h3>ServiceLink · Mortgage Servicing</h3><p>Accounting, reconciliation, vendor payments and client workflows brought the earlier lessons together: multi-LOB platforms, financial controls, exception handling, integrations and measurable operating outcomes.</p><div class="chips"><b>$180M+</b><b>8 LOBs</b><b>Accounting</b><b>Payments</b></div>','<div class="year">2025—NOW</div><div class="chapter"><span>05 · PLATFORMS</span><h2>Enterprise Platforms & Financial Operations</h2><h3>ServiceLink</h3><p>I moved into platform product leadership across regulated enterprise workflows — financial operations, reconciliation, integrations and workflow modernization spanning multiple business processes.</p><div class="chips"><b>Platforms</b><b>Financial Operations</b><b>Integrations</b><b>Workflow Design</b></div>')
          replace('product-journey.html','<h3>Title Automation · Doc Verify · Productflix Labs</h3><p>The current chapter is less about adding an AI feature and more about redesigning the workflow around what machines do well, what rules should own, and where human judgment remains essential.</p><div class="chips"><b>$1.5M projected savings</b><b>AI extraction</b><b>Human review</b><b>Exception routing</b></div>','<h3>Document Intelligence · Workflow Automation · Productflix Labs</h3><p>My current product work increasingly focuses on where AI belongs inside operational systems: what should be deterministic, what benefits from model interpretation, and where people should remain in control.</p><div class="chips"><b>Document Intelligence</b><b>Workflow Automation</b><b>Human Review</b><b>Exception Design</b></div>')

          # RECEIPTS: remove drafting note and make award wording factual.
          replace('receipts.html','<div class="section-head"><div><small>AWARDS</small><h2>Recognition that meant something.</h2></div><div class="note">I’m keeping only defensible, public-facing wording here — no inflated selectivity claims.</div></div>','<div class="section-head"><div><small>AWARDS</small><h2>Recognition that meant something.</h2></div></div>')
          replace('receipts.html','Learning Mindset category. Recognition within the Product Capability Group for standout contribution and learning mindset.','Recognition within Publicis Sapient’s Product Capability Group in the Learning Mindset category.')

          # QUICK-VIEW DATA: prevent removed metrics/details from resurfacing in homepage modals.
          replace('app.js','metrics: [["9 yrs", "career arc"], ["4", "industry chapters"], ["Systems → AI", "through-line"]]','metrics: [["8.5+ yrs", "career arc"], ["4", "industry chapters"], ["Systems → AI", "through-line"]]')
          replace('app.js','''title: "Doc Verify",\n    meta: "2026 · Enterprise AI · Mortgage · In Production",\n    summary: "AI-assisted document intelligence that combines deterministic rules, OCR/LLM interpretation and human review to reduce repetitive mortgage document QC.",\n    metrics: [["79K+", "packages/year"], ["4.4 FTE", "capacity unlocked"], ["$184K", "annual gross impact"]],\n    problem: "Manual QC required repetitive reviews of high-volume document packages, with common failures concentrated in signatures, notary execution and date validation.",\n    role: "0→1 product lead across discovery, business case, workflow design, governance, rollout sequencing and cross-functional execution."''','''title: "Document Verification",\n    meta: "2026 · Enterprise AI · Regulated Operations · In Production",\n    summary: "AI-assisted verification that combines deterministic rules, document intelligence and human review to reduce repetitive manual QC in a regulated workflow.",\n    metrics: [["Rules-first", "deterministic checks"], ["AI-assisted", "interpretation"], ["Human review", "exceptions"]],\n    problem: "High-volume verification required people to repeatedly locate evidence before making decisions, even when many conditions could be handled more systematically.",\n    role: "Product lead across discovery, workflow design, governance, human-in-the-loop controls and cross-functional execution."''')
          replace('app.js','''title: "Title Automation",\n    meta: "2026 · Enterprise Automation · 8 LOBs",\n    summary: "A configurable title-search and production workflow using provider integrations, automated retrieval, data extraction, exception routing and human review.",\n    metrics: [["8", "lines of business"], ["$1.5M", "projected annual savings"], ["0→1", "platform build"]],\n    problem: "Title production relied on fragmented provider workflows, manual search, document retrieval, data keying and package assembly.",\n    role: "Product strategy, workflow architecture, provider/integration design, automation roadmap, exception model and business-case ownership."''','''title: "Title Workflow Automation",\n    meta: "2026 · Enterprise Automation · In Build",\n    summary: "A configurable workflow platform connecting external data sources, automated retrieval, structured extraction, exception routing and human review.",\n    metrics: [["0→1", "platform"], ["Rules + AI", "orchestration"], ["Human review", "exceptions"]],\n    problem: "A fragmented production workflow relied on repeated search, document retrieval, data interpretation and manual handoffs.",\n    role: "Product strategy, workflow architecture, integration design, automation roadmap and exception-model ownership."''')

          # Guardrails: fail rather than publish if the high-risk details remain in the cleaned surfaces.
          risky = ['79.2K','79K+','4.4 FTE','$184.8K','$184K','7,392','17.5 mo','111%','$1.5M','8 LOBs','8 lines of business','M4</b><span>RON','M5</b><span>QC-Only','M6</b><span>Mobile Notary','founding-PM internship','Nine years of building']
          for path in ['index.html','doc-verify.html','title-automation.html','product-journey.html','app.js']:
              text=Path(path).read_text()
              hits=[x for x in risky if x in text]
              if hits:
                  raise SystemExit(f'Risky content still present in {path}: {hits}')
          PY
      - name: Commit sanitized portfolio
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html doc-verify.html title-automation.html product-journey.html receipts.html app.js
          git commit -m 'Sanitize employer case studies'
          git push
