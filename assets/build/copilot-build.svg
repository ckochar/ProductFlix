<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AI Product Copilot visual</title><desc id="d">Blue violet cinematic interface showing product signals, recommendations and trade-offs.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#060b18"/><stop offset=".55" stop-color="#0b1430"/><stop offset="1" stop-color="#08091a"/></linearGradient><linearGradient id="accent" x2="1"><stop stop-color="#5fe5ff"/><stop offset=".5" stop-color="#5f8cff"/><stop offset="1" stop-color="#a66cff"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="20" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="s"><feDropShadow dx="0" dy="24" stdDeviation="30" flood-opacity=".52"/></filter></defs><rect width="1600" height="900" rx="48" fill="url(#bg)"/><circle cx="1250" cy="220" r="320" fill="#623dff" opacity=".1" filter="url(#g)"/><circle cx="980" cy="650" r="250" fill="#19ccff" opacity=".06" filter="url(#g)"/><g transform="translate(90 92)"><text x="0" y="82" fill="#f6f8ff" font-family="Georgia,serif" font-size="70" font-weight="700">AI PRODUCT</text><text x="0" y="170" fill="url(#accent)" font-family="Georgia,serif" font-size="102" font-weight="700">COPILOT</text><text x="4" y="218" fill="#8eb3ff" font-family="Arial" font-size="22" letter-spacing="5">STRATEGY · PRIORITIZATION · DECISIONS</text><rect x="0" y="263" width="170" height="50" rx="25" fill="#10193a" stroke="#5f8cff"/><circle cx="28" cy="288" r="7" fill="#6fe7ff" filter="url(#g)"/><text x="48" y="296" fill="#d6e9ff" font-family="Arial" font-size="18" font-weight="700">PROTOTYPE</text><text x="0" y="420" fill="#8da0c3" font-family="Arial" font-size="27">Challenge assumptions.</text><text x="0" y="460" fill="#8da0c3" font-family="Arial" font-size="27">Surface alternatives. Demand evidence.</text></g><g transform="translate(560 90)" filter="url(#s)"><rect width="930" height="675" rx="34" fill="#09101f" stroke="#213467"/><rect width="930" height="62" rx="34" fill="#0d1630"/><text x="28" y="39" fill="#dce9ff" font-family="Arial" font-size="18" font-weight="700">✦ Product Copilot</text><g font-family="Arial" font-size="14" fill="#8090b3"><text x="615" y="38" fill="#70dfff">CHAT</text><text x="680" y="38">INSIGHTS</text><text x="770" y="38">ROADMAP</text><text x="850" y="38">DOCS</text></g><rect x="32" y="92" width="866" height="74" rx="16" fill="#101a35" stroke="#263e77"/><text x="56" y="122" fill="#dbe7ff" font-family="Arial" font-size="16">Which features should we build next quarter?</text><text x="56" y="146" fill="#8190b1" font-family="Arial" font-size="13">Use user feedback, impact, effort and strategic fit.</text><rect x="824" y="106" width="50" height="42" rx="10" fill="url(#accent)"/><text x="843" y="134" fill="#fff" font-family="Arial" font-size="20">→</text><g transform="translate(32 195)"><rect width="235" height="390" rx="18" fill="#0d1730" stroke="#1d2f61"/><text x="18" y="34" fill="#72dbff" font-family="Arial" font-size="15" font-weight="700">SIGNALS</text><g font-family="Arial" font-size="14" fill="#cad5ef"><text x="24" y="85">◌ User feedback</text><text x="24" y="126">◌ Product analytics</text><text x="24" y="167">◌ Support patterns</text><text x="24" y="208">◌ Market research</text><text x="24" y="249">◌ Strategic goals</text></g><g stroke="#4e72ca" opacity=".7"><line x1="180" y1="82" x2="300" y2="130"/><line x1="180" y1="126" x2="300" y2="150"/><line x1="180" y1="208" x2="300" y2="175"/></g></g><g transform="translate(295 230)"><rect width="170" height="170" rx="28" fill="#111e40" stroke="#4b6bd4"/><circle cx="85" cy="68" r="34" fill="#20356c" stroke="#6b95ff"/><text x="59" y="75" fill="#9eeaff" font-family="Arial" font-size="20" font-weight="700">AI</text><text x="48" y="124" fill="#cfd9f5" font-family="Arial" font-size="15" font-weight="700">SYNTHESIZE</text></g><g transform="translate(490 195)"><rect width="408" height="390" rx="18" fill="#0d1730" stroke="#253b72"/><text x="20" y="34" fill="#dbe6ff" font-family="Arial" font-size="15" font-weight="700">RECOMMENDATIONS</text><g font-family="Arial"><rect x="18" y="58" width="372" height="66" rx="12" fill="#102847"/><text x="34" y="83" fill="#8cf0df" font-size="14">1 · Improve onboarding flow</text><text x="34" y="105" fill="#768cae" font-size="12">High impact · Low effort</text><text x="340" y="94" fill="#8cf0df" font-size="20" font-weight="700">92</text><rect x="18" y="137" width="372" height="66" rx="12" fill="#161f43"/><text x="34" y="162" fill="#9ac4ff" font-size="14">2 · Advanced search filters</text><text x="34" y="184" fill="#768cae" font-size="12">High impact · Medium effort</text><text x="340" y="173" fill="#9ac4ff" font-size="20" font-weight="700">85</text><rect x="18" y="216" width="372" height="66" rx="12" fill="#211a46"/><text x="34" y="241" fill="#c4a1ff" font-size="14">3 · Team collaboration</text><text x="34" y="263" fill="#7f7b9e" font-size="12">Medium impact · Medium effort</text><text x="340" y="252" fill="#c4a1ff" font-size="20" font-weight="700">78</text><rect x="18" y="302" width="180" height="58" rx="12" fill="#101a35" stroke="#263f77"/><text x="34" y="328" fill="#7f90b7" font-size="12">TRADE-OFF</text><text x="34" y="348" fill="#d6e0fa" font-size="13">Impact vs effort</text><rect x="210" y="302" width="180" height="58" rx="12" fill="#101a35" stroke="#533e8d"/><text x="226" y="328" fill="#9f85d9" font-size="12">EVIDENCE</text><text x="226" y="348" fill="#e5dcff" font-size="13">Why this bet?</text></g></g></g></g><g transform="translate(104 784)" font-family="Arial" font-size="18" fill="#7190c5"><text>ASK WHY</text><text x="160">→</text><text x="205" fill="#7ce7ff">ALTERNATIVES</text><text x="390">→</text><text x="435" fill="#9a9cff">RISKS</text><text x="545">→</text><text x="590" fill="#bf8fff">EVIDENCE</text></g></svg>