<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">AI Product Copilot visual</title><desc id="desc">Blue, cyan and violet decision-support interface for product strategy.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101d"/><stop offset="0.55" stop-color="#0b1730"/><stop offset="1" stop-color="#100b24"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#63e6ff"/><stop offset="0.5" stop-color="#6f94ff"/><stop offset="1" stop-color="#a975ff"/></linearGradient></defs><rect width="1600" height="900" rx="48" fill="url(#bg)"/><circle cx="1280" cy="170" r="300" fill="#693dff" opacity="0.11"/><circle cx="1050" cy="700" r="250" fill="#1ad7ff" opacity="0.07"/><g transform="translate(80 95)"><text x="0" y="82" fill="#f7f9ff" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="800">AI PRODUCT</text><text x="0" y="176" fill="url(#accent)" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="800">COPILOT</text><text x="2" y="224" fill="#8db5ff" font-family="Arial, Helvetica, sans-serif" font-size="21" letter-spacing="4">CHALLENGE ASSUMPTIONS. SURFACE OPTIONS.</text><rect x="0" y="270" width="180" height="48" rx="24" fill="#101b38" stroke="#5f8cff"/><text x="34" y="301" fill="#dce9ff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">PROTOTYPE</text><text x="0" y="405" fill="#8ea2c7" font-family="Arial, Helvetica, sans-serif" font-size="28">A thinking partner for product decisions.</text><text x="0" y="447" fill="#8ea2c7" font-family="Arial, Helvetica, sans-serif" font-size="28">Evidence, trade-offs and alternatives in one flow.</text></g><g transform="translate(585 92)"><rect width="930" height="690" rx="34" fill="#09111f" stroke="#263d78" stroke-width="2"/><rect width="930" height="64" rx="34" fill="#0d1730"/><text x="28" y="40" fill="#dbe8ff" font